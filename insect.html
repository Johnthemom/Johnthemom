<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insect Game</title>
    <link rel="stylesheet" href="style/insect.css">
</head>
<body>

<a href="index.html" class="home-btn">Home</a>
    <div class="screen active">
        <h1>Catch The Bug</h1>
        <button class="btn" id="start-btn">Play Game</button>
    </div>


    <div class="screen">
        <h1>Choose your bug</h1>
        <ul class="insect-list">
            <li>
                <button class="choose-insect-btn">
                    <p>Dragonfly</p>
                    <img src="images/fly.png" alt="fly">
                </button>
            </li>
            <li>
                <button class="choose-insect-btn">
                    <p>Mantis</p>
                    <img src="images/mosquito.png" alt="mosquito">
                </button>
            </li>
            <li>
                <button class="choose-insect-btn">
                    <p>Spider</p>
                    <img src="images/spider.webp" alt="Spider">
                </button>
            </li>
            <li>
                <button class="choose-insect-btn">
                    <p>Ladybug</p>
                    <img src="images/tick.webp" alt="tick">
                </button>
            </li>
        </ul>
    </div>

    <div class="screen game-container">
        <h3 id="time" class="time">Time: 00:00</h3>
        <h3 id="score" class="score">Score: 0</h3>
        <h3 id="message" class="message">Youll never win </h3>
    </div>

    <script src="script/insect.js"></script>
</body>
</html>
